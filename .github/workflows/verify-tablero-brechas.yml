name: Verificación del tablero de brechas
on:
  push:
    branches: [main]
  pull_request:
    paths: ["src/**", "api/**", "package.json", "vite.config.js"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Pruebas unitarias y seguridad V09
        run: npm test
      - name: Compilar Vite
        run: npm run build
